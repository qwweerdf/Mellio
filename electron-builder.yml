appId: com.mellio.app
productName: Mellio
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - THIRD_PARTY_NOTICES.md
asar: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
